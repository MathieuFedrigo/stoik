services:
  postgres:
    image: postgres:16-alpine
    container_name: stoik-postgres
    environment:
      POSTGRES_USER: stoik
      POSTGRES_PASSWORD: stoik
      POSTGRES_DB: stoik
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoik -d stoik"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stoik-backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://stoik:stoik@postgres:5432/stoik
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stoik-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
